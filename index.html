<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения, Ирина!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #110022, #2a0055, #5a0099, #cc0066);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    color: #fff;
    padding: 40px 20px;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Звезды */
  .star {
    position: fixed;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  /* Сердечки */
  .float-heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 1;
    opacity: 0.5;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    to { transform: translateY(-100vh); opacity: 0; }
  }

  /* Конфетти */
  .confetti {
    position: fixed;
    top: -20px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 50;
    will-change: transform, opacity;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(360deg); opacity: 0; }
  }

  /* Главная карточка */
  .card {
    background: rgba(20, 0, 40, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 32px;
    padding: 50px 40px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    position: relative;
    z-index: 10;
    text-align: center;
    animation: cardIn 0.8s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ffd700, #ff69b4, #00ffff, #ffd700);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    font-weight: 800;
  }
  @keyframes shine { to { background-position: 300% center; } }

  .name {
    font-size: clamp(2.5rem, 10vw, 4.5rem);
    font-style: italic;
    letter-spacing: 3px;
    margin: 10px 0 25px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,105,180,0.9), 0 0 40px rgba(138,43,226,0.8);
    animation: pulseName 3s ease-in-out infinite;
  }
  @keyframes pulseName {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  .greeting {
    font-size: clamp(1rem, 3vw, 1.15rem);
    line-height: 1.8;
    margin-bottom: 35px;
    color: #f5e6ff;
  }
  .greeting p { margin-bottom: 12px; }

  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 1rem;
    padding: 14px 28px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-weight: 700;
  }
  .btn-gift {
    background: linear-gradient(135deg, #ff6ec4, #ffb86c);
    color: #3a0040;
    box-shadow: 0 6px 20px rgba(255,110,196,0.4);
  }
  .btn-music {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
  }
  button:hover { transform: translateY(-3px) scale(1.02); }
  .btn-gift:hover { box-shadow: 0 10px 30px rgba(255,110,196,0.8); }
  .btn-music:hover { background: rgba(255,255,255,0.2); }

  /* === БЛОК С МЕМАМИ === */
  .memes {
    margin-top: 45px;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .memes-title {
    font-size: 0.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }
  
  .meme-grid {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .meme-card {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 160px;
    height: 160px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  .meme-card:hover {
    transform: translateY(-5px);
    border-color: #ff69b4;
    background: rgba(255, 105, 180, 0.1);
  }
  .meme-card:active { transform: scale(0.95); }

  .meme-icon {
    font-size: 3.5rem;
    margin-bottom: 12px;
    transition: transform 0.2s;
  }
  .meme-card:hover .meme-icon { transform: scale(1.1) rotate(5deg); }

  .meme-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    text-align: center;
    pointer-events: none;
  }

  /* === ПОПАП МЕМОВ === */
  .meme-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(30, 0, 50, 0.95);
    border: 2px solid #ff69b4;
    border-radius: 20px;
    padding: 20px 40px;
    font-size: 1.5rem;
    font-weight: 800;
    color: #fff;
    z-index: 1000;
    transition: transform 0.2s cubic-bezier(.2,.8,.3,1.4), opacity 0.2s;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 0 40px rgba(255,105,180,0.6);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .meme-popup.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* === СЮРПРИЗ === */
  .surprise {
    position: fixed;
    inset: 0;
    background: rgba(10, 0, 20, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .surprise.show { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .surprise-box {
    background: linear-gradient(160deg, #2d0050, #6a0dad);
    border: 2px solid #ff69b4;
    border-radius: 28px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(255,105,180,0.5);
    animation: popIn 0.3s cubic-bezier(.2,.8,.3,1.4);
  }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .surprise-box h2 { font-size: 2rem; margin-bottom: 16px; color: #ffd700; }
  .surprise-box p  { line-height: 1.8; margin-bottom: 24px; color: #ffe4f5; font-size: 1.1rem; }
  .big-heart { font-size: 4rem; animation: beat 1.2s infinite; display: inline-block; margin-bottom: 10px; }
  @keyframes beat { 0%,100% { transform: scale(1); } 30% { transform: scale(1.2); } 60% { transform: scale(0.95); } }
</style>
</head>
<body>

  <div class="card">
    <h1>С Днём Рождения</h1>
    <div class="name">Ирина</div>

    <div class="greeting">
      <p>Здоровья, денег и чтобы всё было нормально.</p>
      <p>Не болей, не парься по мелочам. Остальное приложится.</p>
    </div>

    <div class="buttons">
      <button class="btn-gift" onclick="showSurprise()">🎁 Открыть сюрприз</button>
      <button class="btn-music" onclick="toggleMusic()" id="musicBtn">🎵 Включить музыку</button>
    </div>

    <!-- МЕМЫ -->
    <div class="memes">
      <div class="memes-title">Бонус</div>
      <div class="meme-grid">

        <div class="meme-card" onclick="playMeme('brbr')">
          <div class="meme-icon">🗣️</div>
          <span class="meme-label">бр бр<br>патапим</span>
        </div>

        <div class="meme-card" onclick="playMeme('pocoyo')">
          <div class="meme-icon">🕺</div>
          <span class="meme-label">покойо</span>
        </div>

        <div class="meme-card" onclick="playMeme('naklad')">
          <div class="meme-icon">🍲</div>
          <span class="meme-label">иди<br>накладывай</span>
        </div>

      </div>
    </div>
  </div>

  <div class="surprise" id="surprise" onclick="closeSurprise(event)">
    <div class="surprise-box">
      <div class="big-heart">❤️</div>
      <h2>Всё, хватит</h2>
      <p>Поздравил — и хватит. С днём рождения.<br>
      Если будут проблемы — не звони мне.</p>
      <button class="btn-gift" onclick="closeSurprise()">Ок</button>
    </div>
  </div>

  <div class="meme-popup" id="memePopup"></div>

<script>
/* ---------- ФОН: ЗВЁЗДЫ ---------- */
for (let i = 0; i < 50; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top  = Math.random() * 100 + 'vh';
  document.body.appendChild(s);
}

/* ---------- ФОН: СЕРДЕЧКИ ---------- */
const emojis = ['💖','✨','🌸','💗'];
function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'float-heart';
  h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = (Math.random() * 15 + 15) + 'px';
  h.style.animationDuration = (Math.random() * 5 + 8) + 's';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 13000);
}
setInterval(spawnHeart, 1500);

/* ---------- КОНФЕТТИ ---------- */
const colors = ['#ff69b4','#ffd700','#00ffff','#fff'];
function burstConfetti(count = 40) {
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (Math.random() * 2 + 2) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.width = (Math.random() * 6 + 4) + 'px';
    c.style.height = (Math.random() * 8 + 6) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}
window.addEventListener('load', () => setTimeout(() => burstConfetti(60), 500));

/* ---------- СЮРПРИЗ ---------- */
function showSurprise() {
  document.getElementById('surprise').classList.add('show');
  burstConfetti(30);
}
function closeSurprise(e) {
  if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
  document.getElementById('surprise').classList.remove('show');
}

/* ---------- МУЗЫКА ---------- */
let audioCtx = null;
let playing = false;
let stopTimeout = null;

function playHappyBirthday() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const G = 392.00, A = 440.00, B = 493.88, C = 523.25, D = 587.33, E = 659.25, F = 698.46, E5 = 783.99, D5 = 587.33;

  const melody = [
    [G,0.5],[G,0.5],[A,1],[G,1],[C,1],[B,2],
    [G,0.5],[G,0.5],[A,1],[G,1],[D,1],[C,2],
    [G,0.5],[G,0.5],[E5,1],[C,1],[B,1],[A,2],
    [F,0.5],[F,0.5],[D5,1],[C,1],[B,1],[C,2]
  ];

  const beat = 0.32;
  let t = audioCtx.currentTime + 0.1;

  melody.forEach(([freq, dur]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur * beat * 0.95);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur * beat);
    t += dur * beat;
  });

  const totalMs = (t - audioCtx.currentTime) * 1000 + 300;
  clearTimeout(stopTimeout);
  stopTimeout = setTimeout(() => {
    playing = false;
    document.getElementById('musicBtn').textContent = '🎵 Включить музыку';
  }, totalMs);
}

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!playing) {
    playHappyBirthday();
    playing = true;
    btn.textContent = '⏸️ Остановить музыку';
    stopTimeout = setTimeout(function repeat() {
      if (!playing) return;
      playHappyBirthday();
    }, 9000);
  } else {
    playing = false;
    clearTimeout(stopTimeout);
    if (audioCtx) audioCtx.close().then(() => { audioCtx = null; });
    btn.textContent = '🎵 Включить музыку';
  }
}

/* ---------- МЕМЫ И ЗВУКИ ---------- */
const memeSounds = {
  brbr:   'Брр_Брр_Патапим.mp3',
  pocoyo: 'Pocoyo_dance__pocoyo__lyrics.mp3',
  naklad: '' 
};

const memes = {
  brbr:   { text: 'бр бр патапим',  sound: memeSounds.brbr },
  pocoyo: { text: 'покойо',         sound: memeSounds.pocoyo },
  naklad: { text: 'иди накладывай', sound: memeSounds.naklad }
};

let memePopupTimer = null;
let currentAudio = null;

function playMeme(key) {
  const meme = memes[key];
  if (!meme) return;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  if (meme.sound) {
    currentAudio = new Audio(meme.sound);
    
    // === ЗДЕСЬ ИЗМЕНЕНА ГРОМКОСТЬ НА МАКСИМУМ ===
    currentAudio.volume = 1.0; 
    
    currentAudio.play().catch(err => console.log('Ошибка звука:', err));
  }

  const popup = document.getElementById('memePopup');
  popup.textContent = meme.text;
  popup.classList.add('show');
  
  burstConfetti(20);

  clearTimeout(memePopupTimer);
  memePopupTimer = setTimeout(() => popup.classList.remove('show'), 1500);
}
</script>

</body>
</html>
